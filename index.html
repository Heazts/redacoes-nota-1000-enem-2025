<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta

    content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'self'; frame-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; connect-src 'none'; upgrade-insecure-requests"
  >
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Leitor — Redações Nota 1000 ENEM 2025</title>
  <meta
    name="description"
    content="Leia online a coletânea educacional de redações Nota 1000 do ENEM 2025."

  <link rel="stylesheet" href="./assets/reader.css">
</head>
<body>
  <main class="reader-shell">
    <header class="reader-header">
      <div>
        <p class="eyebrow">Coletânea educacional</p>
        <h1>Redações Nota 1000 — ENEM 2025</h1>
        <p class="subtitle">Leia o PDF diretamente no navegador.</p>
      </div>

      <nav class="reader-actions" aria-label="Ações do documento">
        <a
          class="button button-primary"
          href="./coletanea/Coletanea_Redacoes_ENEM_2025_By_Heazts.pdf"

          class="button"
          href="./coletanea/Coletanea_Redacoes_ENEM_2025_By_Heazts.pdf"

      <a
        href="./coletanea/Coletanea_Redacoes_ENEM_2025_By_Heazts.pdf"
